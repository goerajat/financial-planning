# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.rg.financialplanning=INFO

# Listens on every interface so a phone on the tailnet can open it; ops/firewall.ps1
# then blocks the port from everywhere but Tailscale and loopback.
server.address=0.0.0.0

# Finance aggregator mapping (holder -> person, account type -> item type). Empty = ~/.financial-planning/aggregator.json
aggregator.config=

# Plan store. Empty = ~/.financial-planning/planner.db
planner.db=

# The claude CLI used for premium research on the Persons tab. Empty = found on PATH.
claude.executable=
